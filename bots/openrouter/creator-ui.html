<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Neo-Faille / Atelier équipement</title><style>:root{--bg:#1a1620;--fg:#e8e0f0;--muted:#9a8db8;--accent:#c8a0e0;--card:#251f30;--border:#3d3250;--warn:#e0b060;--err:#e07070;--ok:#70c0a0}@media(prefers-color-scheme:light){:root{--bg:#f5f0fa;--fg:#2a1a3a;--muted:#6a5a8a;--accent:#8a5ab8;--card:#ede5f5;--border:#d0c0e0}}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);max-width:440px;margin:0 auto}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}h1{font-size:16px;font-weight:600;margin:0}.demo-badge{font-size:11px;color:var(--muted);background:var(--card);padding:2px 8px;border-radius:4px;border:1px solid var(--border)}main{padding:12px 16px 100px;display:grid;gap:12px}.row{display:flex;gap:8px;flex-wrap:wrap}label{font-size:12px;color:var(--muted);margin-bottom:4px;display:block}select,button{appearance:none;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font:inherit;min-height:44px;touch-action:manipulation}select{flex:1;min-width:120px}select:focus,button:focus{outline:2px solid var(--accent);outline-offset:2px}button{cursor:pointer;transition:background .15s}button:hover{background:var(--border)}button:active{background:var(--accent);color:#1a1620}button:disabled{opacity:.5;cursor:not-allowed}.slot-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot-btn{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px 4px;text-align:center;font-size:11px}.slot-btn.empty{background:var(--card);border-style:dashed}.slot-btn.equipped{border-color:var(--accent);background:rgba(200,160,224,.15)}.item-name{font-size:10px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#preview-wrap{height:230px;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;position:relative}#preview{width:100%;height:100%;display:block}.preview-label{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);text-align:center;padding:0 8px}#inventory{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}#inventory button{aspect-ratio:1;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;text-align:center}#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}#stats div{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 8px}#stats span{display:block;font-size:18px;font-weight:600;color:var(--accent)}#stats small{color:var(--muted)}.error{background:rgba(224,112,112,.15);border:1px solid var(--err);color:var(--err);padding:10px 12px;border-radius:8px;font-size:13px;display:flex;gap:8px;align-items:flex-start}.error button{padding:6px 10px;font-size:12px;min-height:36px;flex-shrink:0}.warn{background:rgba(224,176,96,.15);border:1px solid var(--warn);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:12px}@media(max-width:390px){:root{--vw:1vw}main{padding:8px 12px 90px}#inventory{grid-template-columns:repeat(3,1fr)}#stats{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><h1>Neo-Faille / Atelier équipement</h1><span class="demo-badge">DÉMO — hors baseline</span></header><main><div class="row" style="flex-direction:column;gap:12px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label for="morph">Morphologie</label><select id="morph"><option value="standard">Standard</option><option value="athletique">Athlétique</option><option value="pulpeuse">Pulpeuse</option></select></div><div><label for="sexe">Sexe</label><select id="sexe"><option value="feminin">Féminin</option><option value="masculin">Masculin</option></select></div></div><div><label for="dir">Direction (rangées démo)</label><select id="dir"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option></select></div></div><div id="preview-wrap"><svg id="preview" viewBox="0 0 390 520" preserveAspectRatio="xMidYMid meet"></svg><p class="preview-label">Aperçu schématique — pas ajustement réel</p></div><div class="warn" style="font-size:11px">Équipés (clic pour retirer)</div><div class="slot-grid" id="equipped"></div><div class="warn" style="font-size:11px">Inventaire (clic pour équiper)</div><div id="inventory"></div><div id="stats"></div><div id="errors"></div></main><script src="./equipment.js"></script><script>(()=>{const slots=['head','backpack','chest','legs','gloves','weapon','offhand','hair','shoes','belt','body'];const slotLabel={'head':'Tête','backpack':'Dos','chest':'Torse','legs':'Jambes','gloves':'Gants','weapon':'Arme','offhand':'Main gauche','hair':'Cheveux','shoes':'Pieds','belt':'Ceinture','body':'Corps'};const slotOrder=['body','legs','shoes','chest','belt','gloves','head','hair','backpack','offhand','weapon'];const shapes={body:{w:140,h:220,rx:20},head:{w:100,h:100,rx:50},hair:{w:110,h:110,rx:55},chest:{w:130,h:110,rx:15},legs:{w:100,h:160,rx:10},shoes:{w:100,h:40,rx:5},belt:{w:130,h:20,rx:3},gloves:{w:30,h:50,rx:5},backpack:{w:80,h:120,rx:10},weapon:{w:30,h:140,rx:3},offhand:{w:40,h:60,rx:5}};const cx=195;const baseY={body:380,legs:380,shoes:480,chest:300,belt:340,gloves:[420,420],head:180,hair:170,backpack:300,weapon:320,offhand:340};let eq=null,corrupt=false,blockSave=false;const $=s=>document.querySelector(s);const el=(t,a={},c=[])=>{const e=document.createElement(t);Object.entries(a).forEach(([k,v])=>k==='text'?e.textContent=v:e.setAttribute(k,v));c.forEach(x=>e.append(x));return e;};function hex(c){return /^#[0-9a-f]{6}$/i.test(c)?c:'#888888'}function draw(){const s=eq.snapshot(),b=s.body;$('#morph').value=b.morphology;$('#sexe').value=b.sex;const svg=$('#preview'),ns="http://www.w3.org/2000/svg";svg.replaceChildren();const S=(t,a)=>{const e=document.createElementNS(ns,t);for(const k in a)e.setAttribute(k,a[k]);return e};const T=b.morphology==='pulpeuse'?120:100,tx=195-T/2;const clr=c=>hex(c||'#777777');const layers=eq.getLayers(Number($('#dir').value));for(const l of layers){const {slot,item}=l,c=clr(item?.color);switch(slot){case'body':svg.append(S('rect',{x:tx,y:155,width:T,height:130,fill:c}));svg.append(S('rect',{x:155,y:285,width:80,height:150,fill:c}));svg.append(S('circle',{cx:195,cy:110,r:36,fill:c}));break;case'backpack':svg.append(S('rect',{x:110,y:150,width:170,height:280,fill:c}));break;case'chest':svg.append(S('rect',{x:tx,y:155,width:T,height:130,fill:c}));break;case'legs':svg.append(S('rect',{x:155,y:285,width:80,height:150,fill:c}));break;case'shoes':svg.append(S('rect',{x:145,y:435,width:100,height:25,fill:c}));break;case'gloves':svg.append(S('rect',{x:115,y:235,width:30,height:80,fill:c}));svg.append(S('rect',{x:250,y:235,width:30,height:80,fill:c}));break;case'weapon':svg.append(S('rect',{x:290,y:180,width:15,height:220,fill:c}));break;case'offhand':svg.append(S('rect',{x:70,y:210,width:45,height:90,fill:c}));break;case'hair':svg.append(S('rect',{x:155,y:65,width:80,height:45,fill:c}));break;case'belt':svg.append(S('rect',{x:tx,y:275,width:T,height:15,fill:c}));break;case'head':svg.append(S('circle',{cx:195,cy:110,r:36,fill:c}));break}}}function renderEquipped(){const c=$('#equipped');c.innerHTML='';slots.forEach(slot=>{const item=eq.snapshot().equipped[slot];const btn=el('button',{class:`slot-btn ${item?'equipped':'empty'}`,'aria-label':`${slotLabel[slot]}: ${item?item.name:'vide'}`,title:item?item.name:''});btn.append(el('span',{text:slotLabel[slot]}));if(item)btn.append(el('span',{class:'item-name',text:item.name}));btn.onclick=()=>{if(item){eq.unequip(slot);save()}};c.append(btn)})}function renderInventory(){const c=$('#inventory');c.innerHTML='';eq.snapshot().inventory.forEach(item=>{const btn=el('button',{'aria-label':`Équiper ${item.name}`,title:item.name});btn.style.background=hex(item.color);btn.append(el('span',{class:'item-name',text:item.name}));btn.onclick=()=>{eq.equip(item.id);save()};c.append(btn)})}function renderStats(){const c=$('#stats');c.innerHTML='';const s=eq.getStats();Object.entries(s).forEach(([k,v])=>{c.append(el('div',{},[el('span',{text:v}),el('small',{text:k})]))})}function save(){if(blockSave)return;const r=eq.save();if(!r.ok)showError(r.error);draw();renderEquipped();renderInventory();renderStats()}function load(){try{const r=eq.load();if(!r.ok){if(r.error==='empty'){seed();return}corrupt=true;blockSave=true;showError(`Données corrompues: ${r.error}. Réinitialisation requise.`);return}corrupt=false;blockSave=false;$('#errors').innerHTML='';draw();renderEquipped();renderInventory();renderStats()}catch(e){corrupt=true;blockSave=true;showError(`Erreur critique: ${e.message}`)}}function showError(msg){const c=$('#errors');c.replaceChildren();const d=document.createElement('div');d.textContent=msg;const b=document.createElement('button');b.textContent='R\u00e9initialiser';b.onclick=reset;d.appendChild(b);c.appendChild(d)}function seed(){const items=[{id:'head-1',name:'Casque cuir',slot:'head',folder:'head',stats:{arm:3},color:'#5a4a3a'},{id:'backpack-1',name:'Sac voyageur',slot:'backpack',folder:'backpack',stats:{cap:10},color:'#4a5a3a'},{id:'chest-1',name:'Tunique lin',slot:'chest',folder:'chest',stats:{arm:5,cha:2},color:'#8a7a5a'},{id:'legs-1',name:'Braies laine',slot:'legs',folder:'legs',stats:{arm:4},color:'#3a4a5a'},{id:'gloves-1',name:'Gants cuir',slot:'gloves',folder:'gloves',stats:{dex:2},color:'#5a4a3a'},{id:'weapon-1',name:'Épée courte',slot:'weapon',folder:'weapon',stats:{atk:12},color:'#7a7a8a'},{id:'offhand-1',name:'Bouclier rond',slot:'offhand',folder:'offhand',stats:{def:8},color:'#6a6a7a'},{id:'hair-1',name:'Cheveux longs',slot:'hair',folder:'hair',stats:{cha:3},color:'#3a2a1a'},{id:'shoes-1',name:'Bottes cuir',slot:'shoes',folder:'shoes',stats:{mov:2},color:'#4a3a2a'},{id:'belt-1',name:'Ceinture cuir',slot:'belt',folder:'belt',stats:{cap:5},color:'#5a4a3a'},{id:'body-1',name:'Sous-vêtements',slot:'body',folder:'body',stats:{},color:'#6b5b8a'},{id:'chest-2',name:'Plastron fer',slot:'chest',folder:'chest',stats:{arm:15},color:'#8a8a9a'}];items.forEach(i=>eq.addItem(i));eq.setBody({morphology:'standard',sex:'feminin'});eq.equip('chest-1');eq.equip('legs-1');eq.equip('shoes-1');eq.equip('head-1');eq.equip('backpack-1');save()}function reset(){if(!confirm('R\u00e9initialiser la d\u00e9mo ?'))return;try{localStorage.removeItem('neo-faille-demo');location.reload()}catch(e){showError(e.message)}}try{eq=new Equipment({storage:localStorage,key:'neo-faille-demo',backpackInFrontRows:[0,1],weaponAfterShieldRows:[1,2,3]});window.demoEquipment=eq;}catch(e){eq=new Equipment({key:'neo-faille-demo',backpackInFrontRows:[0,1],weaponAfterShieldRows:[1,2,3]});window.demoEquipment=eq;}$('#morph').onchange=e=>{eq.setBody({morphology:e.target.value,sex:$('#sexe').value});save();draw()};$('#sexe').onchange=e=>{eq.setBody({morphology:$('#morph').value,sex:e.target.value});save();draw()};$('#dir').onchange=draw;load();})();</script></body></html>
